name: money_manager
description: "Private Android expense tracker for Hong Kong."
publish_to: 'none'

# Raising the version publishes a new release from CI (the build number comes from the CI run).
version: 1.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.35.1
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_riverpod: ^3.4.3
  fl_chart: ^1.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  archive: ^4.3.0
  sqlite3: ^3.5.2
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  crypto: ^3.0.7
  xml: ^7.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

# SQLite3 Multiple Ciphers instead of plain SQLite, so the database can be encrypted (lib/data/encryption.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
