name: CI

on:
  push:
    branches: [main]
  pull_request:

# main 上面嘅 run 逐個行，Release 先會按 build 號次序發佈
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # database.g.dart is committed; fail if it no longer matches database.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generated code is up to date
        run: |
          dart format lib/data/database.g.dart
          git diff --exit-code -- lib/
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # 固定簽署金鑰（由 tools/setup-android-signing.ps1 放入 GitHub Secrets），新版本先可以直接蓋過舊版
      - name: Release signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: money-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # pubspec.yaml 嘅 version 改咗先出 Release（App 入面「檢查更新」就係睇呢度）；tag 維持 build-N，舊版 App 先認得
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未設定簽署金鑰，唔出 Release。請喺電腦行 tools/setup-android-signing.ps1"
            exit 0
          fi
          name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if gh release list --limit 100 --json name --jq '.[].name' | grep -q "^v$name "; then
            echo "v$name 已經發佈過；要出新版就改 pubspec.yaml 嘅 version"
            exit 0
          fi
          apk="money-manager-$name-build$BUILD.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "build-$BUILD" "$apk" --title "v$name (build $BUILD)" --generate-notes --target "$GITHUB_SHA"
