name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # run_number 只會遞增，用嚟做 versionCode，App 靠佢判斷有冇新版
      BUILD_NUMBER: ${{ github.run_number }}
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Release builds must be signed: ANDROID_KEYSTORE_BASE64 secret is missing"
              exit 1
            fi
            echo "No signing secrets (fork PR?) - building with the debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/release.jks
          pw=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          alias=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$pw" "$pw" "$alias" > android/key.properties
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --build-number=$BUILD_NUMBER
      - name: Check APK signature
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $apksigner"
          certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || { echo "$certs"; exit 1; }
          echo "$certs" | grep -i "certificate" || true
          if [ "$IS_RELEASE" = "true" ] && echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is debug-signed"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: money-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          cp build/app/outputs/flutter-apk/app-release.apk money-manager.apk
          gh release create "build-$BUILD_NUMBER" money-manager.apk \
            --title "v$version ($BUILD_NUMBER)" \
            --generate-notes \
            --target "$GITHUB_SHA"
